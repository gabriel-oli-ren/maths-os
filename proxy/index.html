<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathSupport Proxy</title>
  <!-- Google Analytics (opcional, pon tu ID) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <!-- Estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0e17;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #e6edf3;
    }
    /* ========= SIDEBAR (colapsable) ========= */
    .navbar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 72px;
      background: #0f1420;
      border-right: 1px solid #2a303c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      transition: width 0.2s ease;
      z-index: 100;
      overflow-x: hidden;
    }
    .navbar.expanded {
      width: 240px;
    }
    .nav-brand {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .nav-brand img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }
    .nav-brand span {
      display: none;
      margin-left: 12px;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .navbar.expanded .nav-brand span {
      display: inline;
    }
    .nav-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 16px;
      margin: 4px 0;
      color: #b3c0d2;
      text-decoration: none;
      border-radius: 12px;
      transition: 0.2s;
      white-space: nowrap;
    }
    .nav-item:hover {
      background: #1e2538;
      color: white;
    }
    .nav-item .material-symbols-outlined {
      font-size: 24px;
      min-width: 40px;
      text-align: center;
    }
    .nav-item span:last-child {
      margin-left: 8px;
      display: none;
    }
    .navbar.expanded .nav-item span:last-child {
      display: inline;
    }
    .nav-footer {
      margin-top: auto;
      width: 100%;
    }
    /* ========= MAIN LAYOUT ========= */
    .app-container {
      margin-left: 72px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* ========= TAB BAR ========= */
    .tab-bar {
      background: #0f1420;
      border-bottom: 1px solid #2a303c;
      padding: 8px 12px 0 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .tab {
      background: #1a1f2e;
      border-radius: 8px 8px 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: 0.1s;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab.active {
      background: #0a0e17;
      border-bottom-color: #2f81f7;
    }
    .tab-title {
      font-size: 0.85rem;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      background: none;
      border: none;
      color: #8b949e;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 0 4px;
    }
    .tab-close:hover {
      color: #f85149;
    }
    .new-tab-btn {
      background: #1a1f2e;
      border: none;
      color: #e6edf3;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
    }
    /* ========= BROWSER NAVBAR ========= */
    .browser-nav {
      background: #0a0e17;
      padding: 8px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid #2a303c;
    }
    .nav-controls {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background: #1a1f2e;
      border: none;
      color: #e6edf3;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1a1f2e;
      border-radius: 24px;
      padding: 4px 12px;
      gap: 8px;
    }
    .address-favicon {
      width: 18px;
      height: 18px;
      background: #2a303c;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .address-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 0.9rem;
      padding: 8px 0;
      outline: none;
    }
    /* ========= CONTENT AREA ========= */
    .browser-content {
      flex: 1;
      position: relative;
      background: white;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0e17;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.2s;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a303c;
      border-top-color: #2f81f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="navbar" id="sidebar">
  <div class="nav-brand">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232f81f7'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3E%3C/svg%3E" alt="Logo">
    <span>MathSupport</span>
  </div>
  <a class="nav-item" href="#">
    <span class="material-symbols-outlined">home</span>
    <span>Home</span>
  </a>
  <a class="nav-item" href="#">
    <span class="material-symbols-outlined">sports_esports</span>
    <span>Games</span>
  </a>
  <div class="nav-footer">
    <a class="nav-item" href="#">
      <span class="material-symbols-outlined">settings</span>
      <span>Settings</span>
    </a>
  </div>
</div>

<div class="app-container">
  <div class="tab-bar" id="tab-bar">
    <div class="tab active" data-tab-id="0" data-url="/newtab">
      <span class="tab-title">New Tab</span>
      <button class="tab-close">×</button>
    </div>
    <button class="new-tab-btn" id="new-tab-btn">+</button>
  </div>
  <div class="browser-nav">
    <div class="nav-controls">
      <button class="nav-btn" id="nav-reload">⟳</button>
      <button class="nav-btn" id="nav-fullscreen">⛶</button>
    </div>
    <div class="address-bar">
      <div class="address-favicon" id="favicon">🌐</div>
      <input type="text" class="address-input" id="address-input" placeholder="Search or enter address">
    </div>
  </div>
  <div class="browser-content" id="browser-content">
    <div class="loading-overlay hidden" id="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
    <iframe id="proxy-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-pointer-lock allow-top-navigation-by-user-activation" allowfullscreen></iframe>
  </div>
</div>

<script>
  // ---------- CONFIGURACIÓN ----------
  const WORKER_URL = 'https://search.mathssupport.cat'; // CAMBIA A TU WORKER
  let currentTabId = 0;
  let tabs = new Map(); // id -> { url, title, iframe? }

  const iframe = document.getElementById('proxy-frame');
  const addressInput = document.getElementById('address-input');
  const reloadBtn = document.getElementById('nav-reload');
  const fullscreenBtn = document.getElementById('nav-fullscreen');
  const newTabBtn = document.getElementById('new-tab-btn');
  const tabBar = document.getElementById('tab-bar');

  // Cargar URL en el iframe usando el Worker
  function loadUrl(url) {
    if (!url.startsWith('http')) url = 'https://' + url;
    const proxyUrl = `${WORKER_URL}/?url=${encodeURIComponent(url)}`;
    iframe.src = proxyUrl;
    addressInput.value = url;
    // Guardar en la pestaña actual
    const activeTab = document.querySelector('.tab.active');
    if (activeTab) {
      const titleSpan = activeTab.querySelector('.tab-title');
      titleSpan.textContent = url.length > 30 ? url.slice(0,30)+'...' : url;
      tabs.set(currentTabId, { url, title: url });
    }
    // Mostrar loading
    document.getElementById('loading-overlay').classList.remove('hidden');
    iframe.onload = () => {
      document.getElementById('loading-overlay').classList.add('hidden');
      // Intentar obtener favicon
      // (no podemos acceder fácilmente al iframe por CORS, pero se puede mejorar con un mensaje)
    };
  }

  // Crear nueva pestaña
  function newTab() {
    const newId = Date.now();
    const tabDiv = document.createElement('div');
    tabDiv.className = 'tab';
    tabDiv.dataset.tabId = newId;
    tabDiv.innerHTML = `
      <span class="tab-title">New Tab</span>
      <button class="tab-close">×</button>
    `;
    // Insertar antes del botón +
    tabBar.insertBefore(tabDiv, newTabBtn);
    // Activar esta pestaña
    activateTab(newId);
    // Limpiar iframe y mostrar página de inicio
    iframe.src = 'about:blank';
    addressInput.value = '';
    tabs.set(newId, { url: null, title: 'New Tab' });
    // Cargar página de inicio (puede ser una página local)
    loadUrl('https://example.com'); // o una página de bienvenida personalizada
  }

  function activateTab(tabId) {
    // Desactivar todas
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    const selected = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
    if (selected) {
      selected.classList.add('active');
      currentTabId = parseInt(tabId);
      const tabData = tabs.get(currentTabId);
      if (tabData && tabData.url) {
        addressInput.value = tabData.url;
        loadUrl(tabData.url);
      } else {
        iframe.src = 'about:blank';
        addressInput.value = '';
      }
    }
  }

  function closeTab(tabId) {
    if (document.querySelectorAll('.tab').length <= 1) return; // mantener al menos una
    const tabElem = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
    if (tabElem) tabElem.remove();
    tabs.delete(parseInt(tabId));
    // Activar la primera pestaña que quede
    const firstTab = document.querySelector('.tab');
    if (firstTab) activateTab(parseInt(firstTab.dataset.tabId));
    else newTab();
  }

  // Eventos
  reloadBtn.onclick = () => {
    if (iframe.src) iframe.src = iframe.src;
  };
  fullscreenBtn.onclick = () => {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  addressInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') loadUrl(addressInput.value);
  });
  newTabBtn.onclick = () => newTab();

  // Delegación de eventos para pestañas
  tabBar.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    if (e.target.classList.contains('tab-close')) {
      e.stopPropagation();
      closeTab(parseInt(tab.dataset.tabId));
    } else {
      activateTab(parseInt(tab.dataset.tabId));
    }
  });

  // Inicializar primera pestaña
  newTab(); // crea una pestaña y carga ejemplo
</script>
</body>
</html>
