<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maths Browse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0a0a1e;--fg:#fff;--bar:#15152e;--accent:#5b8cff;--muted:#7e7ea0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
  #bar{display:flex;gap:6px;padding:8px;background:var(--bar);align-items:center;border-bottom:1px solid #222}
  #bar button{background:#222;border:0;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
  #bar button:hover{background:#333}
  #url{flex:1;padding:8px 14px;border-radius:10px;border:1px solid #2a2a4a;background:#0d0d24;color:#fff;font-size:14px}
  #go{background:var(--accent);padding:0 16px;width:auto}
  #status{color:var(--muted);font-size:12px;padding:0 8px}
  #frame{width:100%;height:calc(100% - 50px);border:0;background:#000}
</style>
</head>
<body>
<div id="bar">
  <button id="back" title="Back">←</button>
  <button id="fwd" title="Forward">→</button>
  <button id="reload" title="Reload">⟳</button>
  <input id="url" placeholder="Search Maths Browse or enter URL" spellcheck="false">
  <button id="go">Go</button>
  <span id="status">●</span>
</div>
<iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; camera; microphone; geolocation"
        sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-downloads"
        allowfullscreen></iframe>

<script>
// ---- Config ----
// Change this to your deployed Cloudflare Worker URL.
const PROXY = "https://search.mathssupport.cat";

// ---- Service worker (optional; enables faster subresource handling) ----
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

const $ = (id) => document.getElementById(id);
const frame = $("frame"), url = $("url"), status = $("status");
const history = []; let hi = -1;

function normalize(v){
  v = v.trim();
  if (!v) return "";
  if (!/^https?:\/\//i.test(v)) {
    if (/\s/.test(v) || !/\./.test(v)) return "https://duckduckgo.com/?q=" + encodeURIComponent(v);
    v = "https://" + v;
  }
  return v;
}
function go(raw, push=true){
  const u = normalize(raw); if (!u) return;
  url.value = u;
  frame.src = PROXY + "/p/" + encodeURIComponent(u);
  if (push){ history.splice(hi+1); history.push(u); hi = history.length - 1; }
}

$("go").onclick = () => go(url.value);
url.addEventListener("keydown", (e) => { if (e.key === "Enter") go(url.value); });
$("back").onclick = () => { if (hi > 0){ hi--; go(history[hi], false);} };
$("fwd").onclick = () => { if (hi < history.length-1){ hi++; go(history[hi], false);} };
$("reload").onclick = () => { frame.src = frame.src; };

// Health check
fetch(PROXY + "/p/" + encodeURIComponent("https://example.com"), {method:"HEAD"})
  .then(r => status.textContent = r.ok ? "● online" : "● offline")
  .catch(() => status.textContent = "● offline");

// Parse ?url= from query string (deep links)
const initial = new URLSearchParams(location.search).get("url");
go(initial || "https://duckduckgo.com/");
</script>
</body>
</html>
