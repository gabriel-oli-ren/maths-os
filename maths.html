<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Maths OS — Unblocked Games, Apps & Browser</title>
<meta name="description" content="Maths OS — desktop with games, browser, friends and live chat. Loads at mathssupport.cat." />
<link rel="icon" href="https://maths-os.lovable.app/maths.png" type="image/png" />
<link rel="canonical" href="https://mathssupport.cat/maths.html" />
<meta property="og:title" content="Maths OS — Unblocked Games & Apps" />
<meta property="og:description" content="Desktop OS with games, browser, friends, chat — runs in your browser." />
<meta property="og:image" content="https://maths-os.lovable.app/maths.png" />
<meta property="og:url" content="https://mathssupport.cat/maths.html" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#080810;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080810}
  #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,#0d0d2e 0%,#1a0a3e 50%,#0a1a40 100%);z-index:10;transition:opacity .4s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader img{width:78px;height:78px;border-radius:18px;box-shadow:0 18px 50px rgba(76,194,255,.35)}
  #loader .title{font-size:1.6em;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff,#4cc2ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  #loader .sub{font-size:.85em;color:rgba(255,255,255,.55)}
  #loader .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.15);border-top-color:#4cc2ff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:#080810;color:#fff}
</style>
</head>
<body>
  <div id="loader">
    <img src="https://maths-os.lovable.app/maths.png" alt="Maths OS" onerror="this.style.display='none'" />
    <div class="title">Maths OS</div>
    <div class="spinner"></div>
    <div class="sub">Loading the desktop…</div>
  </div>

  <iframe
    id="frame"
    src="https://maths-os.lovable.app/"
    title="Maths OS"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; camera; microphone; geolocation"
    allowfullscreen
  ></iframe>

  <noscript>
    <div>
      <h1>JavaScript required</h1>
      <p>Maths OS needs JavaScript. Visit <a href="https://maths-os.lovable.app/" style="color:#4cc2ff">maths-os.lovable.app</a> directly.</p>
    </div>
  </noscript>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var loader = document.getElementById('loader');
      var hidden = false;
      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add('hide');
        setTimeout(function () { loader.remove(); }, 500);
      }
      frame.addEventListener('load', hideLoader);
      // Failsafe: hide loader after 8s even if onload doesn't fire (cross-origin).
      setTimeout(hideLoader, 8000);
    })();
  </script>
</body>
</html>
